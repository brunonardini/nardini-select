# CodeQL security scanning. Alerts go only to the Security tab, which only
# people with write access can see (today, only the owner).
#
# This repository is public, so this workflow never runs on pull requests:
# code scanning posts PR alerts as review annotations that anyone who can
# read the PR can see. Scans run on main after a merge, weekly, and on demand.
# Don't add a pull_request trigger, debug logging, or artifact uploads (SARIF
# or databases), and keep GitHub's CodeQL "default setup" disabled.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1' # Mondays 06:27 UTC (03:27 in Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # actions: the GitHub workflows in .github/workflows.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # Third-party agent skills and local tooling, not site code.
          config: |
            paths-ignore:
              - .agents
              - .claude
              - .cursor
              - .codex
              - .impeccable

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

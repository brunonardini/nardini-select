# The PR title becomes the squash commit on main, which semantic-release reads,
# so it must follow Conventional Commits (see AGENTS.md).
name: PR title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-slim
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same types as commitlint and AGENTS.md.
          types: |
            feat
            fix
            build
            chore
            ci
            docs
            perf
            refactor
            revert
            style
            test
          # Lowercase description without a trailing period.
          subjectPattern: ^(?![A-Z]).*[^.]$
          subjectPatternError: |
            The description "{subject}" in the PR title "{title}" must start
            with a lowercase letter and must not end with a period.

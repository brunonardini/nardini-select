version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

executors:
  node:
    docker:
      # Keep this tag in sync with .nvmrc.
      - image: cimg/node:26.13.1
    working_directory: ~/project
  playwright:
    docker:
      # Keep this tag in sync with @playwright/test in package-lock.json:
      # the image ships the browsers and system libraries for that version.
      - image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_directory: ~/project
  # Postgres 18 matches Neon. The password below is for this CI container only.
  node-postgres:
    docker:
      - image: cimg/node:26.13.1
      - image: postgres:18
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    working_directory: ~/project
  playwright-postgres:
    docker:
      - image: mcr.microsoft.com/playwright:v1.65.1-noble
      - image: postgres:18
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    working_directory: ~/project

commands:
  attach_setup:
    description: Restore the checked-out project and node_modules from setup.
    steps:
      - attach_workspace:
          at: ~/project
  wait_for_postgres:
    description: Wait until the Postgres service container accepts connections.
    steps:
      - run:
          name: Wait for Postgres
          command: |
            node --input-type=module \<<'EOF'
            import pg from 'pg';

            const connectionString = process.env.PROVISION_URL;
            if (!connectionString) {
              console.error('PROVISION_URL is not set.');
              process.exit(1);
            }

            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const client = new pg.Client({ connectionString });
              try {
                await client.connect();
                await client.end();
                process.exit(0);
              } catch {
                await client.end().catch(() => {});
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
            }

            console.error('Postgres did not accept connections.');
            process.exit(1);
            EOF
  refuse_forks:
    description: Stop when this pipeline comes from a fork.
    steps:
      - run:
          name: Refuse forks
          # Preview credentials stay on branches of this repository. A fork
          # pull request sets CIRCLE_PR_USERNAME to the fork owner.
          command: |
            if [ -n "$CIRCLE_PR_USERNAME" ] && [ "$CIRCLE_PR_USERNAME" != "$CIRCLE_PROJECT_USERNAME" ]; then
              echo "Fork pipelines do not receive preview credentials."
              exit 1
            fi

jobs:
  setup:
    executor: node
    steps:
      - checkout
      # node_modules is reused as-is when package-lock.json hasn't changed.
      - restore_cache:
          name: Restore node_modules
          keys:
            - node-modules-v1-{{ arch }}-{{ checksum "package-lock.json" }}
      # On a miss, the npm download cache (any older key) speeds up npm ci.
      - restore_cache:
          name: Restore npm cache
          keys:
            - npm-cache-v1-{{ arch }}-{{ checksum "package-lock.json" }}
            - npm-cache-v1-{{ arch }}-
      - run:
          name: Install dependencies
          command: |
            if [ -d node_modules ]; then
              echo "node_modules restored from cache; skipping npm ci"
            else
              npm ci --prefer-offline --no-audit --no-fund
            fi
      - save_cache:
          name: Save npm cache
          key: npm-cache-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - save_cache:
          name: Save node_modules
          key: node-modules-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  lint:
    executor: node
    steps:
      - attach_setup
      - run:
          name: ESLint
          command: npm run lint

  prettier:
    executor: node
    steps:
      - attach_setup
      - run:
          name: Prettier
          command: npm run format:check

  knip:
    executor: node
    steps:
      - attach_setup
      - run:
          name: Knip (unused files, dependencies, and exports)
          command: npm run knip

  typecheck:
    executor: node
    steps:
      - attach_setup
      - run:
          name: TypeScript
          command: npm run typecheck

  unit-tests:
    executor: node
    steps:
      - attach_setup
      - run:
          name: Vitest with coverage
          command: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=reports/unit/junit.xml
      - store_test_results:
          path: reports/unit
      # Uses the CODECOV_TOKEN environment variable set in the CircleCI project.
      - codecov/upload:
          files: coverage/lcov.info
          disable_search: true
          flags: unit
          fail_on_error: true

  build:
    executor: node
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - attach_setup
      # Next.js reuses compiled output from .next/cache across builds.
      - restore_cache:
          name: Restore Next.js build cache
          keys:
            - next-cache-v1-{{ arch }}-{{ checksum "package-lock.json" }}-{{ .Revision }}
            - next-cache-v1-{{ arch }}-{{ checksum "package-lock.json" }}-
      - run:
          name: Next.js build
          command: npm run build
      - save_cache:
          name: Save Next.js build cache
          key: next-cache-v1-{{ arch }}-{{ checksum "package-lock.json" }}-{{ .Revision }}
          paths:
            - .next/cache
      - persist_to_workspace:
          root: ~/project
          paths:
            - .next

  e2e-tests:
    parameters:
      project:
        type: enum
        enum: [desktop, mobile]
        description: Playwright project from playwright.config.ts.
    executor: playwright-postgres
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      # CI-only role passwords. They are not used anywhere else.
      PROVISION_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PROVISION_CREATE_DATABASES: '1'
      APP_MIGRATOR_PASSWORD: ci-migrator
      APP_RUNTIME_PASSWORD: ci-runtime
      AUDIT_MAINTAINER_PASSWORD: ci-audit
      DATABASE_MIGRATION_URL: postgres://app_migrator:ci-migrator@127.0.0.1:5432/nardini_test
      DATABASE_URL: postgres://app_runtime:ci-runtime@127.0.0.1:5432/nardini_test
      BETTER_AUTH_URL: http://localhost:3200
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long
      GOOGLE_CLIENT_ID: test-google-client
      GOOGLE_CLIENT_SECRET: test-google-secret
      WHATSAPP_NUMBER: '5511999999999'
    steps:
      - attach_setup
      - wait_for_postgres
      - run:
          name: Provision, migrate, and seed nardini_test
          command: |
            npm run db:provision
            npm run db:migrate
            npm run db:seed
      - run:
          name: Playwright (<< parameters.project >>)
          # The build job already produced .next; Playwright only starts it.
          command: npx playwright test --project=<< parameters.project >>
      - store_test_results:
          path: reports/e2e
      - store_artifacts:
          path: playwright-report
      - store_artifacts:
          path: test-results

  storybook:
    # Story tests run in Chromium (Vitest browser mode), so this job uses the
    # Playwright image, like the E2E tests.
    executor: playwright
    environment:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - attach_setup
      - run:
          name: Story tests (render, interactions, and axe checks)
          command: npm run test:storybook -- --reporter=default --reporter=junit --outputFile.junit=reports/storybook/junit.xml
      - store_test_results:
          path: reports/storybook
      - run:
          name: Storybook static build
          command: npm run build-storybook

  db-check:
    executor: node-postgres
    environment:
      # CI-only role passwords. They are not used anywhere else.
      PROVISION_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PROVISION_CREATE_DATABASES: '1'
      APP_MIGRATOR_PASSWORD: ci-migrator
      APP_RUNTIME_PASSWORD: ci-runtime
      AUDIT_MAINTAINER_PASSWORD: ci-audit
      DATABASE_MIGRATION_URL: postgres://app_migrator:ci-migrator@127.0.0.1:5432/nardini_dev
      DATABASE_URL: postgres://app_runtime:ci-runtime@127.0.0.1:5432/nardini_dev
    steps:
      - attach_setup
      - wait_for_postgres
      - run:
          name: Provision and migrate an empty database
          command: |
            npm run db:provision
            npm run db:migrate
      - run:
          name: Lint migrations
          command: npm run db:lint
      - run:
          name: Check generated schema types
          command: |
            DATABASE_URL="$DATABASE_MIGRATION_URL" npm run db:codegen
            git diff --exit-code db/schema.d.ts
      - run:
          name: Check grants
          command: npm run db:grants

  migrate-production:
    executor: node
    steps:
      - attach_setup
      - run:
          name: Migrate production
          # DATABASE_MIGRATION_URL comes from the nardini-select-prod-migrate
          # context: the direct Neon endpoint as app_migrator.
          command: |
            set -o pipefail
            mkdir -p reports
            npm run db:migrate | tee reports/migrate-production.txt
      - store_artifacts:
          path: reports/migrate-production.txt

  deploy-production:
    executor: node
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Stop when this commit has no release
          command: |
            if [ ! -f release/version ]; then
              echo "No release version; skipping the production deploy."
              circleci-agent step halt
            fi
      - run:
          name: Build and deploy to Netlify production
          # Builds on this machine with the production context, so the
          # build gets the site's production variables and
          # CONTEXT=production, plus SENTRY_RELEASE from this shell.
          # Do not pass --remote: Netlify Build status is Stopped
          # builds. The netlify.toml ignore command does not run here.
          # NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID come from the
          # nardini-select-prod-deploy context.
          command: |
            version=$(tr -d '[:space:]' < release/version)
            export RELEASE_VERSION="$version"
            export SENTRY_RELEASE="nardini-select@$version"
            npx --yes netlify-cli@27.19.0 deploy \
              --prod \
              --context production \
              --message "Release v$RELEASE_VERSION ($SENTRY_RELEASE)"

  preview-migrate:
    executor: node
    steps:
      - attach_setup
      - refuse_forks
      - run:
          name: Reset, migrate, and seed nardini_stg
          # DATABASE_MIGRATION_URL and DATABASE_URL come from the
          # nardini-select-preview-db context. db:reset refuses every
          # database except nardini_dev, nardini_test, and nardini_stg.
          command: |
            set -o pipefail
            mkdir -p reports
            npm run db:reset | tee reports/preview-migrate.txt
      - store_artifacts:
          path: reports/preview-migrate.txt

  preview-deploy:
    executor: node
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - attach_setup
      - refuse_forks
      - run:
          name: Build and deploy the staging alias
          # Builds on this machine. NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID
          # come from the nardini-select-preview-deploy context. No
          # SENTRY_RELEASE: the preview release is the commit SHA. Do not
          # pass --prod or --remote. Netlify Build status is Stopped
          # builds, and the netlify.toml ignore command does not run
          # here.
          command: |
            npx --yes netlify-cli@27.19.0 deploy \
              --context deploy-preview \
              --alias staging \
              --message "Preview ${CIRCLE_BRANCH} ${CIRCLE_SHA1}"

  release:
    executor: node
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - attach_setup
      # The workspace holds the setup job's checkout. Running checkout again
      # fetches origin into it and sets up the SSH keys for git.
      - checkout
      - run:
          name: Fetch tags
          # semantic-release finds the last version from the vX.Y.Z tags.
          command: git fetch --force --tags origin
      - run:
          name: semantic-release
          # Tags HEAD and creates the GitHub release when the commits since
          # the last tag call for a new version. Uses GH_TOKEN.
          command: >-
            npx --yes
            --package semantic-release@25.0.9
            --package conventional-changelog-conventionalcommits@9.3.1
            semantic-release
      - run:
          name: Record the release version
          # Downstream deploy reads this file. No file means this commit
          # does not release. Do not halt before the workspace is saved.
          command: |
            mkdir -p release
            tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
            if [ -z "$tag" ]; then
              echo "No new version for this commit."
              exit 0
            fi
            version="${tag#v}"
            printf '%s\n' "$version" > release/version
            echo "Releasing $tag"
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

workflows:
  validate:
    jobs:
      - setup
      - lint:
          requires: [setup]
      - prettier:
          requires: [setup]
      - knip:
          requires: [setup]
      - typecheck:
          requires: [setup]
      - unit-tests:
          requires: [setup]
      - build:
          requires: [setup]
      - storybook:
          requires: [setup]
      - db-check:
          requires: [setup]
      - e2e-tests:
          name: e2e-desktop
          project: desktop
          requires: [build]
      - e2e-tests:
          name: e2e-mobile
          project: mobile
          requires: [build]
      - migrate-production:
          # DATABASE_MIGRATION_URL lives in this context, which only main can use.
          context: nardini-select-prod-migrate
          requires:
            - lint
            - typecheck
            - unit-tests
            - db-check
          filters:
            branches:
              only: main
      - release:
          # GH_TOKEN lives in this context, which only main can use.
          context: nardini-select-release
          requires:
            - migrate-production
          filters:
            branches:
              only: main
      - deploy-production:
          # NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID live in this context.
          context: nardini-select-prod-deploy
          requires:
            - release
          filters:
            branches:
              only: main
  preview:
    when:
      not:
        equal: [main, << pipeline.git.branch >>]
    jobs:
      - preview-approval:
          type: approval
      - preview-migrate:
          context: nardini-select-preview-db
          requires:
            - preview-approval
      - preview-deploy:
          context: nardini-select-preview-deploy
          requires:
            - preview-migrate
